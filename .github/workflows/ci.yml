name: Data assistant tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        jsonschema: ['3.0.0', '4.23.0']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt pytest 'fakeredis[lua]' flask flask-wtf
      - run: pip install 'setuptools<81' 'jsonschema==${{ matrix.jsonschema }}'
      - run: python -m pytest -q tests
